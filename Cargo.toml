[workspace]
resolver = "2"
members = [
    "crates/blocker-core",
    "crates/blocker-tls",
    "crates/blocker-daemon",
    "crates/blocker-gui",
    "crates/blocker-proxy",
    "crates/blocker-tray",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
